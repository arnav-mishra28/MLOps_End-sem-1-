name: Run Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run tests with pytest
        env:
          OPENAI_API_KEY: "mock-key-for-ci"
        run: |
          python -m pytest test_main.py -v
